{% set name = "marshmallow" %}
{% set version = "3.26.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: bbe2adb5a03e6e3571b573f42527c6fe926e17467833660bebd11593ab8dfd57

build:
  skip: true  # [py<39]
  number: 0
  script: {{ PYTHON }} -m pip install --no-deps --no-build-isolation . -vv

requirements:
  host:
    - python
    - pip
    - flit-core <4
  run:
    - python
    - packaging >=17.0

test:
  requires:
    - pip
    - pytest
    - simplejson
    - pytz
  imports:
    - marshmallow
  source_files: tests/*.py
  commands:
    - pip check
    #E AssertionError: Regex pattern did not match.
    - pytest tests/ -k "not test_from_timestamp_with_overflow_value"  # [py>=314 or win]
    - pytest tests/  # [py<314 and not win]

about:
  home: https://github.com/marshmallow-code/marshmallow
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A lightweight library for converting complex datatypes to and from native Python datatypes.
  description: |
    marshmallow is an ORM/ODM/framework-agnostic library for
    converting complex datatypes, such as objects, to and from
    native Python datatypes.
  doc_url: https://marshmallow.readthedocs.io/en/latest/
  dev_url: https://github.com/marshmallow-code/marshmallow/

extra:
  recipe-maintainers:
    - hajapy
    - rth
    - frol
    - igortg
    - carlodri
    - mariusvniekerk
